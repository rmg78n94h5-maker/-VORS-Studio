<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5efe6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="VORS Studio" />
  <meta name="description" content="Управление мастерской тафтинговых ковров" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>VORS Studio</title>
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="brand-mark brand-mark--large">
      <span class="brand-v">V</span>
      <span class="brand-thread"></span>
    </div>
    <div class="splash-title">VORS <span>Studio</span></div>
    <div class="splash-subtitle">Форма. Фактура. Характер.</div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <button class="icon-btn desktop-only" id="sidebarToggle" aria-label="Свернуть меню">☰</button>
      <div class="brand-lockup">
        <div class="brand-mark">
          <span class="brand-v">V</span>
          <span class="brand-thread"></span>
        </div>
        <div>
          <strong>VORS</strong>
          <span>Studio</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="sync-pill" id="syncPill" title="Статус хранения">
          <span class="sync-dot"></span>
          <span class="sync-text">Сохранено локально</span>
        </button>
        <button class="icon-btn" id="roleButton" aria-label="Сменить режим">👤</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <nav class="side-nav" aria-label="Основная навигация">
        <button data-view="today" class="nav-item active"><span>⌂</span><b>Сегодня</b></button>
        <button data-view="projects" class="nav-item"><span>▦</span><b>Проекты</b></button>
        <button data-view="production" class="nav-item"><span>◉</span><b>Производство</b></button>
        <button data-view="materials" class="nav-item"><span>◒</span><b>Материалы</b></button>
        <button data-view="orders" class="nav-item"><span>▣</span><b>Клиенты и заказы</b></button>
        <button data-view="products" class="nav-item"><span>◇</span><b>Готовые изделия</b></button>
        <button data-view="finance" class="nav-item"><span>▥</span><b>Финансы</b></button>
        <button data-view="family" class="nav-item"><span>♧</span><b>Семейный режим</b></button>
      </nav>
      <div class="sidebar-footer">
        <div class="version">VORS Studio <b>0.7.0</b></div>
        <button class="ghost-btn" id="resetDemo">Очистить рабочие данные</button>
      </div>
    </aside>

    <main class="main" id="mainContent" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Мобильная навигация">
      <button data-view="today" class="mobile-nav active"><span>⌂</span><small>Сегодня</small></button>
      <button data-view="projects" class="mobile-nav"><span>▦</span><small>Проекты</small></button>
      <button data-view="production" class="mobile-nav"><span>◉</span><small>Работа</small></button>
      <button data-view="materials" class="mobile-nav"><span>◒</span><small>Склад</small></button>
      <button data-view="more" class="mobile-nav"><span>•••</span><small>Ещё</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
