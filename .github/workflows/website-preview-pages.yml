name: VORS website preview

on:
  push:
    branches:
      - website-v1
    paths:
      - 'website/**'
      - '.github/workflows/website-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vors-website-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle workshop app from main
        run: |
          git fetch origin main --depth=1
          rm -rf website/public/app
          mkdir -p website/public/app
          git archive --format=tar origin/main index.html styles.css materials-ui-0.9.1.css materials-ui-0.9.1.js vors-1.0.css vors-1.0-ui.js vors-1.0-fixes.css vors-1.0-fixes.js vors-1.1-flow.css vors-1.1-flow.js vors-brand-1.2.css vors-brand-1.2.js app.js catalog-kudel-2026-09.js manifest.webmanifest sw.js icons | tar -x -C website/public/app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: website
        run: npm install

      - name: Build Astro preview
        working-directory: website
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Fresh run after Pages was enabled in repository settings.
