name: VORS website build

on:
  push:
    branches:
      - website-v1
    paths:
      - 'website/**'
      - '.github/workflows/website-build.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bundle workshop app from main
        run: |
          git fetch origin main --depth=1
          rm -rf public/app
          mkdir -p public/app
          git archive --format=tar origin/main index.html styles.css materials-ui-0.9.1.css materials-ui-0.9.1.js vors-1.0.css vors-1.0-ui.js vors-1.0-fixes.css vors-1.0-fixes.js vors-1.1-flow.css vors-1.1-flow.js vors-brand-1.2.css vors-brand-1.2.js app.js catalog-kudel-2026-09.js manifest.webmanifest sw.js icons | tar -x -C public/app
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Astro site
        run: npm run build
